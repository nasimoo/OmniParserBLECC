<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Parser Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        .loading-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Screenshot Parser Interface</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left Column: Controls -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Controls</h2>
                <div class="mb-4">
                    <label for="filePrefix" class="block text-sm font-medium text-gray-700 mb-2">File Prefix</label>
                    <input type="text" id="filePrefix" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., home">
                    <p class="mt-1 text-sm text-gray-500">Files will be saved as: prefix_raw.png, prefix_parsed.png, prefix_bbox.csv</p>
                </div>
                <button id="captureBtn" class="w-full bg-blue-500 text-white py-3 px-4 rounded-lg hover:bg-blue-600 transition duration-200 flex items-center justify-center">
                    <i class="fas fa-camera mr-2"></i>
                    Capture Screenshot
                </button>
                <div id="status" class="mt-4 text-center"></div>
            </div>

            <!-- Right Column: Results -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Results</h2>
                <div id="results" class="space-y-4">
                    <div id="imageContainer" class="hidden">
                        <h3 class="text-lg font-medium mb-2">Processed Image</h3>
                        <img id="processedImage" class="w-full rounded-lg shadow-md" alt="Processed Screenshot">
                    </div>
                    <div id="csvContainer" class="hidden">
                        <h3 class="text-lg font-medium mb-2">Parsed Data</h3>
                        <pre id="csvData" class="bg-gray-100 p-4 rounded-lg overflow-x-auto"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loading">
        <div class="loading-content">
            <i class="fas fa-spinner fa-spin fa-3x mb-4"></i>
            <p class="text-xl">Processing screenshot...</p>
        </div>
    </div>

    <script>
        document.getElementById('captureBtn').addEventListener('click', async () => {
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const imageContainer = document.getElementById('imageContainer');
            const csvContainer = document.getElementById('csvContainer');
            const processedImage = document.getElementById('processedImage');
            const csvData = document.getElementById('csvData');
            const filePrefix = document.getElementById('filePrefix').value.trim();

            if (!filePrefix) {
                status.textContent = 'Please enter a file prefix';
                status.className = 'mt-4 text-center text-red-500';
                return;
            }

            // Show loading overlay
            loading.style.display = 'block';
            status.textContent = 'Capturing and processing screenshot...';
            status.className = 'mt-4 text-center text-gray-600';

            try {
                const response = await fetch('/capture', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prefix: filePrefix })
                });

                const data = await response.json();

                if (data.success) {
                    // Display processed image
                    processedImage.src = `data:image/png;base64,${data.image}`;
                    imageContainer.classList.remove('hidden');

                    // Display CSV data
                    csvData.textContent = data.csv;
                    csvContainer.classList.remove('hidden');

                    status.textContent = `Processing completed in ${data.processing_time.toFixed(2)} seconds`;
                    status.className = 'mt-4 text-center text-gray-600';
                } else {
                    status.textContent = `Error: ${data.error}`;
                    status.className = 'mt-4 text-center text-red-500';
                }
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.className = 'mt-4 text-center text-red-500';
            } finally {
                // Hide loading overlay
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
